<style>
  :root{--bg:#0B0E14;--surface:#14182A;--border:#1E2233;--border-strong:#2A3149;--text-1:#E7E9F4;--text-2:#B4B9C7;--text-3:#7A8194;--brand:#7B4EFF;--brand-600:#6A3BF0;--brand-300:#AA8AFF;--cyan:#22D3EE;--error:#EF4444}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 0%,rgba(123,78,255,.20),rgba(34,211,238,.05) 40%,transparent 70%);pointer-events:none}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:44px 40px;max-width:440px;width:100%;text-align:center}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:24px 24px 0 0;background:linear-gradient(135deg,#8F66FF,#22D3EE)}
  .logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:14px;margin-bottom:28px}
  .logo .mark{width:28px;height:28px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 0 18px rgba(123,78,255,.45)}
  .eyebrow{display:block;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-300);margin-bottom:12px}
  h1{font-size:24px;line-height:1.2;letter-spacing:-.025em;font-weight:700;margin-bottom:10px}
  .sub{color:var(--text-2);font-size:14px;line-height:1.55;margin-bottom:26px}
  form{display:flex;flex-direction:column;gap:12px}
  input[type=password]{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;padding:13px 16px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg);color:var(--text-1);outline:none;text-align:center;letter-spacing:.06em;transition:border-color .2s}
  input[type=password]:focus{border-color:var(--cyan)}
  button{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:13px 16px;border:none;border-radius:999px;background:var(--brand);color:#fff;cursor:pointer;transition:background .15s,transform .15s}
  button:hover{background:var(--brand-600);transform:translateY(-1px)}
  button:disabled{opacity:.6;cursor:wait;transform:none}
  .remember{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text-3);cursor:pointer;user-select:none}
  .remember input{accent-color:var(--brand)}
  .error{color:var(--error);font-size:13px;min-height:20px}
  .foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span class="mark">A</span>ALETHEAI</div>
  <span class="eyebrow">Private preview</span>
  <h1>Aletheai Conduct — evidence room</h1>
  <p class="sub">This page is for invited readers. Enter the password you were given. Please don't share the link or the password.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required />
    <label class="remember"><input type="checkbox" id="rm" /> Remember on this device</label>
    <button type="submit" id="btn">Unlock</button>
    <div class="error" id="err"></div>
  </form>
  <div class="foot">© 2026 Aletheai · Monomindai Ltd · Not for distribution</div>
</main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYNS="aletheai-unlock-"+PAYLOAD.salt.slice(0,12);
const SESSION=true;
async function keyFromPassword(pw){
  const raw=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},raw,256);
  return new Uint8Array(bits);
}
async function decryptWith(keyBytes){
  const key=await crypto.subtle.importKey("raw",keyBytes,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
async function reveal(html){
  if(document.readyState==="loading"){await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));}
  document.open();document.write(html);document.close();
}
(async()=>{
  try{const saved=localStorage.getItem(KEYNS);
    if(saved){await reveal(await decryptWith(b64(saved)));return;}
  }catch(e){try{localStorage.removeItem(KEYNS);}catch(_){}}
  if(SESSION){try{const s=sessionStorage.getItem(KEYNS);
    if(s){await reveal(await decryptWith(b64(s)));return;}
  }catch(e){try{sessionStorage.removeItem(KEYNS);}catch(_){}}}
})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("btn"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="Unlocking…";err.textContent="";
  try{
    const keyBytes=await keyFromPassword(document.getElementById("pw").value);
    const html=await decryptWith(keyBytes);
    if(document.getElementById("rm").checked){
      try{localStorage.setItem(KEYNS,btoa(String.fromCharCode(...keyBytes)));}catch(e){}
    }
    if(SESSION){try{sessionStorage.setItem(KEYNS,btoa(String.fromCharCode(...keyBytes)));}catch(e){}}
    await reveal(html);
  }catch(e){
    err.textContent="That password didn't work. Try again.";
    btn.disabled=false;btn.textContent="Unlock";
  }
});
</script>
